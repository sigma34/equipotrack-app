<!DOCTYPE html>
<html lang="es">
  <head>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <meta name="color-scheme" content="dark" />

    <title>Lumo</title>
    <style>
      /* Fondo oscuro y sin márgenes desde el primer instante, en TODAS las pantallas
         (login, activación, recuperar contraseña...). Evita el marco blanco. */
      html, body { margin: 0; padding: 0; background: #07070f; }
      body { min-height: 100vh; min-height: 100dvh; }
      #root { min-height: 100vh; min-height: 100dvh; background: #07070f; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("/sw.js");
    });
  }
</script>
  </body>
</html>
